name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend and Audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run frontend review gate
        run: |
          pnpm check:node-only
          pnpm contract:check
          pnpm lint
          pnpm format:check
          pnpm test
          pnpm build

  node-core:
    name: Node Core (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-2025
          - platform: macos-arm64
            runner: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate Node-only ownership
        run: pnpm check:node-only
      - name: Validate LLM catalog
        run: node scripts/check-llm-catalog.mjs
      - name: Run desktop and Node Core tests
        run: pnpm test:desktop
      - name: Report configured Node LLM live smoke result or explicit SKIP
        run: node --env-file-if-exists=.env.local scripts/node-llm-live-smoke.mjs
      - name: Build unpacked Node-only application
        run: pnpm electron:pack
      - name: Verify packaged Core contents
        run: node scripts/verify-node-only-package.mjs
      - name: Exercise the packaged upgrade and desktop path
        run: node scripts/electron-smoke.ts --packaged

  ssh-e2e:
    name: Isolated Node SSH/SFTP E2E
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install gate dependencies
        run: pnpm install --frozen-lockfile
      - name: Start isolated SSH service
        run: |
          docker build --tag shellspan-ssh-e2e:local tests/ssh-e2e
          docker compose --project-name shellspan-e2e --file tests/ssh-e2e/compose.yml up --detach --wait --pull never
      - name: Run Node SSH/SFTP end-to-end tests
        env:
          SHELLSPAN_E2E_SSH_FIXTURE: '1'
          SHELLSPAN_E2E_SSH_HOST: 127.0.0.1
          SHELLSPAN_E2E_SSH_PORT: '22222'
          SHELLSPAN_E2E_SSH_USERNAME: shellspan
          SHELLSPAN_E2E_SSH_PASSWORD: shellspan-e2e
          SHELLSPAN_E2E_SSH_JUMP_HOST: 127.0.0.1
          SHELLSPAN_E2E_SSH_JUMP_PORT: '22223'
          SHELLSPAN_E2E_SSH_JUMP_TARGET_HOST: ssh
          SHELLSPAN_E2E_SSH_JUMP_TARGET_PORT: '22'
        run: |
          pnpm electron:compile
          node scripts/stage4-ssh-smoke.ts
      - name: Stop isolated SSH service
        if: always()
        run: docker compose --project-name shellspan-e2e --file tests/ssh-e2e/compose.yml down --volumes --remove-orphans
