name: Quality Gate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend and Audit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run frontend review gate
        run: |
          pnpm contract:check
          pnpm test
          pnpm build

  rust:
    name: Rust (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-2025
          - platform: macos
            runner: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Run frontend tests
        run: pnpm test
      - name: Run desktop Core tests
        run: pnpm test:desktop
      - name: Build frontend
        run: pnpm build
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - name: Cache Rust
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: native -> target
          cache-on-failure: true
      - name: Check formatting
        run: |
          cargo fmt --manifest-path native/Cargo.toml --all -- --check
          node scripts/check-rust-includes.mjs
      - name: Validate LLM catalog
        run: node scripts/check-llm-catalog.mjs
      - name: Report configured live smoke results or explicit SKIP
        run: node --env-file-if-exists=.env.local scripts/agent-provider-live-smoke.mjs
      - name: Run Agent terminal contract tests
        run: |
          cargo test --manifest-path native/Cargo.toml --locked agent::terminal -- --test-threads=1
          cargo test --manifest-path native/Cargo.toml --locked terminal_lease -- --test-threads=1
      - name: Run Petdex Phase 0 contract probe
        run: cargo test --manifest-path native/Cargo.toml --locked --test petdex_contract_probe -- --test-threads=1
      - name: Run Clippy
        run: cargo clippy --manifest-path native/Cargo.toml --all-targets --all-features --locked -- -D warnings
      - name: Run Rust tests
        run: cargo test --manifest-path native/Cargo.toml --all-features --no-fail-fast --locked
      - name: Run Stage 5 LLM differential gate
        run: pnpm test:core-stage5
      - name: Report configured Node LLM live smoke result or explicit SKIP
        run: node --env-file-if-exists=.env.local scripts/node-llm-live-smoke.mjs

  ssh-e2e:
    name: Isolated SSH/SFTP E2E
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install gate dependencies
        run: pnpm install --frozen-lockfile
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.95.0
      - name: Cache Rust
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: native -> target
      - name: Start isolated SSH service
        run: |
          docker build --tag shellspan-ssh-e2e:local tests/ssh-e2e
          docker compose --project-name shellspan-e2e --file tests/ssh-e2e/compose.yml up --detach --wait --pull never
      - name: Run Rust and Node SSH/SFTP end-to-end tests
        env:
          SHELLSPAN_E2E_SSH_FIXTURE: '1'
          SHELLSPAN_E2E_SSH_HOST: 127.0.0.1
          SHELLSPAN_E2E_SSH_PORT: '22222'
          SHELLSPAN_E2E_SSH_USERNAME: shellspan
          SHELLSPAN_E2E_SSH_PASSWORD: shellspan-e2e
          SHELLSPAN_E2E_SSH_JUMP_HOST: 127.0.0.1
          SHELLSPAN_E2E_SSH_JUMP_PORT: '22223'
          SHELLSPAN_E2E_SSH_JUMP_TARGET_HOST: ssh
          SHELLSPAN_E2E_SSH_JUMP_TARGET_PORT: '22'
        run: |
          cargo test --manifest-path native/Cargo.toml --locked isolated_ssh_sftp_end_to_end -- --ignored --nocapture --test-threads=1
          pnpm electron:compile
          node scripts/stage4-ssh-smoke.ts
      - name: Stop isolated SSH service
        if: always()
        run: docker compose --project-name shellspan-e2e --file tests/ssh-e2e/compose.yml down --volumes --remove-orphans
