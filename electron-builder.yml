appId: com.shellspan
productName: ShellSpan
directories:
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  - '!dist-electron/after-pack.js'
  - '!dist-electron/tests/**'
  - native/icons/32x32.png
  - package.json
extraResources:
  - from: native/target/release/
    to: native
    filter:
      - shellspan-core
      - shellspan-core.exe
asar: true
mac:
  icon: native/icons/icon.icns
  target: [dmg, zip]
  category: public.app-category.developer-tools
  extendInfo:
    CFBundleDevelopmentRegion: English
win:
  icon: native/icons/icon.ico
  target: nsis
nsis:
  oneClick: true
  perMachine: false
publish:
  provider: github
  owner: hi-fullmoon
  repo: ShellSpan

# Package the exact runtime installed by the lockfile.
electronDist: node_modules/electron/dist

afterPack: dist-electron/after-pack.js
