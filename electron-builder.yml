appId: com.shellspan
productName: ShellSpan
directories:
  output: release
files:
  - dist/**/*
  - dist-electron/**/*
  - '!dist-electron/after-pack.js'
  - '!dist-electron/tests/**'
  - resources/icons/32x32.png
  - package.json
asar: true
# keytar and node-pty ship N-API prebuilds for every supported target. Rebuilding would
# reintroduce a host C++ toolchain requirement and can discard the exact lockfile artifacts.
npmRebuild: false
mac:
  icon: resources/icons/icon.icns
  target: [dmg, zip]
  category: public.app-category.developer-tools
  extendInfo:
    CFBundleDevelopmentRegion: English
win:
  icon: resources/icons/icon.ico
  target: nsis
nsis:
  oneClick: true
  perMachine: false
publish:
  provider: github
  owner: hi-fullmoon
  repo: ShellSpan

# Package the exact runtime installed by the lockfile.
electronDist: node_modules/electron/dist

afterPack: dist-electron/after-pack.js
